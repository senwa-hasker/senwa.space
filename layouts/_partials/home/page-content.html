{{ if .Content }}
  <div
    class="bg-primary/10 border-primary/30 mb-6 rounded-xl border p-6 shadow-sm transition-shadow duration-300 hover:shadow-md hidden"
  >
    <div class="flex items-start gap-4">
      <!-- 图标容器 -->
      <div class="text-primary mt-0.5 shrink-0 text-2xl hidden" aria-hidden="true">📢</div>

      <!-- 内容区域 -->
      <div class="flex-1 space-y-2">
        <div class="text-foreground/80 leading-relaxed">
          {{ .Content }}
        </div>

        <!-- 日期 -->
        {{ with .Params.date }}
          <div class="text-muted-foreground/60 mt-3 text-xs hidden">
            {{ partial "helpers/date.html" (dict "date" . "variant" "long") }}
          </div>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}


  <header class="mb-8 mt-0 pt-0">
    <h1 class="text-foreground mb-4 text-3xl font-bold">
      {{ .Summary }}
    </h1>
    {{ if .Content }}
      <div class="prose prose-neutral dark:prose-invert max-w-none">
        {{ .Content }}
      </div>
    {{ else if .Description }}
      <p class="text-muted-foreground">
        {{ .Description }}
      </p>
    {{ end }}
  </header>
