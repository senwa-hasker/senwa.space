baseURL: https://senwa.space/
locale: en-us
title: senwa.space

taxonomies:
  tag: tags
  topic: topics
  category: categories
  book: books
  character: characters

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
      wrapStandAloneImageWithinParagraph: false
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
  