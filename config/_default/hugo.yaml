baseURL: https://senwa.space/
locale: en
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
title: Senwa.space
theme: "hugo-narrow"

hasCJKLanguage: false
enableEmoji: true


# Main Section Configuration (Optional)
# If not configured, Hugo will automatically select the section with the most pages
# This configuration affects functions such as recent articles on the homepage, search index, and archive pages
mainSections: ["articles", "blog", "projects"]  # Multiple values can be configured, e.g. ["posts", "blog", "articles"]

build:
  noJSConfigInAssets: true

permalinks:
  posts: /posts/:slug/
  pages: /:slug/

# pagination
pagination:
  pagerSize: 6
  path: "page"


taxonomies:
  book: books
  chapter: chapters
  category: categories
  tag: tags
  topic: topics
  character: characters

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  goldmark:
    parser:
      attribute:
        block : true
        title : true
    renderer:
      unsafe: true
    extensions:
      extras:
        delete:
          enable: true
        insert:
          enable: true
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true   
      strikethrough: true 
  highlight:
    codeFences: true
    guessSyntax: false
    lineNos: false
    lineNumbersInTable: false # Set to false
    noClasses: false
    style: github # No need to change
    tabWidth: 2

outputs:
  home: ["HTML", "RSS", "JSON", "WebAppManifest"]

# Custom output formats
outputFormats:
  WebAppManifest:
    mediaType: "application/manifest+json"
    baseName: "site"
    isPlainText: true

module:
  hugoVersion:
    extended: true
    min: 0.158.0
  imports:
    - path: github.com/tom2almighty/hugo-narrow
